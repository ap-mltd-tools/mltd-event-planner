version: "3.9"

services:

  spring:
    build:
      context: ./event-planner-api
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./event-planner-api:/app
    environment:
      SPRING_PROFILES_ACTIVE: dev

  react:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/dev/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - spring
      - react

volumes:
  caddy_data:
  caddy_config: